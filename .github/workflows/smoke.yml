name: AETHERRA Smoke
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  python-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Launch AETHERRA via Windows BAT and verify HTTP health
        shell: pwsh
        run: |
          $env:AETHERRA_NO_BROWSER = '1'
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList @("/c", "AETHERRA.bat") -PassThru -NoNewWindow
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                if ($r.app -eq "AETHERRA") { $healthy = $true; break }
              } catch {}
              if ($proc.HasExited) { break }
            }
            if (-not $healthy) {
              if (Test-Path "AETHERRA_STARTUP.log") { Get-Content "AETHERRA_STARTUP.log" }
              throw "AETHERRA.bat did not launch an HTTP server"
            }
          } finally {
            taskkill /PID $proc.Id /T /F 2>$null | Out-Null
          }
  browser-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract and check inline JavaScript
        run: |
          node tests/check-inline-js.mjs
          node tests/water-path.mjs
          node tests/server-mode.mjs
          node tests/world-economy.mjs
